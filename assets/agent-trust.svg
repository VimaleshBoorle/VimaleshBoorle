<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Trust layer between AI agents</title>
  <desc id="d">A message from Agent A passes identity, scope, delegation and injection checks and reaches Agent B. A message from a spoofed agent fails the checks and is blocked.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .wire { stroke: #30363d; stroke-width: 2; stroke-dasharray: 6 6; }
    .good { animation: good 8s ease-in-out infinite; }
    .bad { opacity: 0; animation: bad 8s ease-in-out infinite; }
    .check { fill: #8b949e; animation: check 8s ease-in-out infinite; }
    .c2 { animation-delay: .25s; } .c3 { animation-delay: .5s; } .c4 { animation-delay: .75s; }
    .deny { opacity: 0; animation: deny 8s ease-in-out infinite; }
    .gate { animation: gate 8s ease-in-out infinite; }
    @keyframes good {
      0%   { transform: translate(0, 0); opacity: 0; }
      4%   { opacity: 1; }
      20%  { transform: translate(150px, 0); opacity: 1; }
      22%  { transform: translate(150px, 0); opacity: 0; }
      40%  { transform: translate(450px, 0); opacity: 0; }
      42%  { transform: translate(450px, 0); opacity: 1; }
      55%  { transform: translate(600px, 0); opacity: 1; }
      58%, 100% { transform: translate(600px, 0); opacity: 0; }
    }
    @keyframes bad {
      0%, 56% { transform: translate(0, 0); opacity: 0; }
      60%  { opacity: 1; }
      76%  { transform: translate(150px, -90px); opacity: 1; }
      80%, 100% { transform: translate(150px, -90px); opacity: 0; }
    }
    @keyframes check { 0%, 25% { fill: #8b949e; } 30%, 52% { fill: #3fb950; } 58%, 100% { fill: #8b949e; } }
    @keyframes deny { 0%, 76% { opacity: 0; } 80%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes gate { 0%, 74% { stroke: #30363d; } 78%, 92% { stroke: #f85149; } 100% { stroke: #30363d; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .good, .bad { opacity: 0; }
      .check { fill: #3fb950; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="298" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- wires -->
  <line class="wire" x1="300" y1="120" x2="450" y2="120"/>
  <line class="wire" x1="750" y1="120" x2="900" y2="120"/>
  <line class="wire" x1="300" y1="230" x2="450" y2="140"/>

  <!-- Agent A -->
  <rect class="box" x="60" y="80" width="240" height="80" rx="12"/>
  <text x="180" y="114" class="sans" font-size="20" font-weight="600" fill="#e6edf3" text-anchor="middle">Agent A</text>
  <text x="180" y="140" class="mono" font-size="13" fill="#8b949e" text-anchor="middle">signed agent card</text>

  <!-- Spoofed agent -->
  <rect class="box" x="60" y="200" width="240" height="60" rx="12" stroke-dasharray="5 5"/>
  <text x="180" y="236" class="mono" font-size="14" fill="#ff7b72" text-anchor="middle">spoofed agent</text>

  <!-- Trust layer -->
  <rect class="box gate" x="450" y="40" width="300" height="220" rx="14"/>
  <text x="600" y="72" class="sans" font-size="18" font-weight="600" fill="#e6edf3" text-anchor="middle">Trust layer</text>
  <g class="mono" font-size="14">
    <text x="478" y="112" class="check c1">✓ identity: card signature</text>
    <text x="478" y="142" class="check c2">✓ scope: payments.read</text>
    <text x="478" y="172" class="check c3">✓ delegation chain intact</text>
    <text x="478" y="202" class="check c4">✓ no injected instructions</text>
  </g>
  <g class="deny">
    <rect x="500" y="222" width="200" height="26" rx="6" fill="#3d1214" stroke="#f85149"/>
    <text x="600" y="240" class="mono" font-size="13" fill="#ff7b72" text-anchor="middle">✕ blocked: bad signature</text>
  </g>

  <!-- Agent B -->
  <rect class="box" x="900" y="80" width="240" height="80" rx="12"/>
  <text x="1020" y="114" class="sans" font-size="20" font-weight="600" fill="#e6edf3" text-anchor="middle">Agent B</text>
  <text x="1020" y="140" class="mono" font-size="13" fill="#8b949e" text-anchor="middle">acts only within scope</text>

  <!-- packets -->
  <circle class="good" cx="300" cy="120" r="8" fill="#3fb950"/>
  <circle class="bad" cx="300" cy="230" r="8" fill="#f85149"/>
</svg>
