<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Vimalesh Boorle, Data Scientist</title>
  <desc id="d">A transaction graph where a fraud ring of five accounts sharing one device lights up and is flagged.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .edge { stroke: #30363d; stroke-width: 1.5; }
    .flow { stroke: #58a6ff; stroke-width: 1.5; stroke-dasharray: 4 10; opacity: .55; animation: flow 3s linear infinite; }
    .node { fill: #161b22; stroke: #8b949e; stroke-width: 1.5; }
    .ring-edge { stroke: #30363d; stroke-width: 1.5; animation: ringEdge 8s ease-in-out infinite; }
    .ring-node { fill: #161b22; stroke: #8b949e; stroke-width: 1.5; animation: ringNode 8s ease-in-out infinite; }
    .halo { fill: none; stroke: #f85149; stroke-width: 1.5; opacity: 0; animation: halo 8s ease-in-out infinite; }
    .flag { opacity: 0; animation: flag 8s ease-in-out infinite; }
    .line { opacity: 0; animation: cycle 12s ease-in-out infinite; }
    .l2 { animation-delay: 4s; }
    .l3 { animation-delay: 8s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes ringEdge { 0%, 35% { stroke: #30363d; } 50%, 85% { stroke: #f85149; } 100% { stroke: #30363d; } }
    @keyframes ringNode { 0%, 35% { stroke: #8b949e; fill: #161b22; } 50%, 85% { stroke: #f85149; fill: #3d1214; } 100% { stroke: #8b949e; fill: #161b22; } }
    @keyframes halo { 0%, 45% { opacity: 0; } 55%, 80% { opacity: .6; } 100% { opacity: 0; } }
    @keyframes flag { 0%, 50% { opacity: 0; } 58%, 85% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(6px); } 5%, 30% { opacity: 1; transform: none; } 35%, 100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .l1, .flag { opacity: 1; }
      .ring-edge { stroke: #f85149; }
      .ring-node { stroke: #f85149; fill: #3d1214; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="338" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- left: identity -->
  <text x="56" y="118" class="sans" font-size="46" font-weight="700" fill="#e6edf3">Vimalesh Boorle</text>
  <text x="58" y="158" class="sans" font-size="20" fill="#8b949e">Data Scientist · Fraud, security &amp; agentic AI</text>

  <text x="58" y="222" class="mono" font-size="22" fill="#3fb950">$</text>
  <g class="mono" font-size="22" fill="#58a6ff">
    <text x="84" y="222" class="line l1">detecting fraud rings in payment graphs<tspan class="cursor">_</tspan></text>
    <text x="84" y="222" class="line l2">applying AI to cybersecurity<tspan class="cursor">_</tspan></text>
    <text x="84" y="222" class="line l3">securing agent-to-agent communication<tspan class="cursor">_</tspan></text>
  </g>

  <text x="58" y="292" class="mono" font-size="14" fill="#8b949e">payments · identities · agents · protocols</text>

  <!-- right: transaction graph -->
  <g>
    <line class="edge" x1="740" y1="90" x2="820" y2="60"/>
    <line class="edge" x1="820" y1="60" x2="900" y2="110"/>
    <line class="edge" x1="740" y1="90" x2="780" y2="190"/>
    <line class="edge" x1="780" y1="190" x2="860" y2="250"/>
    <line class="edge" x1="900" y1="110" x2="780" y2="190"/>
    <line class="edge" x1="900" y1="110" x2="980" y2="70"/>
    <line class="edge" x1="980" y1="70" x2="1100" y2="80"/>
    <line class="edge" x1="860" y1="250" x2="940" y2="290"/>
    <line class="edge" x1="1100" y1="80" x2="1150" y2="180"/>
    <line class="edge" x1="900" y1="110" x2="990" y2="160"/>
    <line class="edge" x1="940" y1="290" x2="1000" y2="240"/>
    <line class="edge" x1="1150" y1="180" x2="1110" y2="200"/>

    <line class="flow" x1="740" y1="90" x2="820" y2="60"/>
    <line class="flow" x1="820" y1="60" x2="900" y2="110"/>
    <line class="flow" x1="780" y1="190" x2="860" y2="250"/>
    <line class="flow" x1="980" y1="70" x2="1100" y2="80"/>
    <line class="flow" x1="900" y1="110" x2="990" y2="160"/>

    <!-- fraud ring: five accounts, one shared device -->
    <circle class="halo" cx="1050" cy="195" r="78"/>
    <g>
      <line class="ring-edge" x1="990" y1="160" x2="1050" y2="195"/>
      <line class="ring-edge" x1="1060" y1="135" x2="1050" y2="195"/>
      <line class="ring-edge" x1="1110" y1="200" x2="1050" y2="195"/>
      <line class="ring-edge" x1="1065" y1="255" x2="1050" y2="195"/>
      <line class="ring-edge" x1="1000" y1="240" x2="1050" y2="195"/>
      <line class="ring-edge" x1="990" y1="160" x2="1060" y2="135"/>
      <line class="ring-edge" x1="1110" y1="200" x2="1065" y2="255"/>
    </g>

    <circle class="node" cx="740" cy="90" r="9"/>
    <circle class="node" cx="820" cy="60" r="7"/>
    <circle class="node" cx="900" cy="110" r="10"/>
    <circle class="node" cx="780" cy="190" r="8"/>
    <circle class="node" cx="860" cy="250" r="9"/>
    <circle class="node" cx="980" cy="70" r="7"/>
    <circle class="node" cx="1100" cy="80" r="8"/>
    <circle class="node" cx="1150" cy="180" r="7"/>
    <circle class="node" cx="940" cy="290" r="8"/>

    <circle class="ring-node" cx="990" cy="160" r="8"/>
    <circle class="ring-node" cx="1060" cy="135" r="8"/>
    <circle class="ring-node" cx="1110" cy="200" r="8"/>
    <circle class="ring-node" cx="1065" cy="255" r="8"/>
    <circle class="ring-node" cx="1000" cy="240" r="8"/>
    <rect class="ring-node" x="1040" y="185" width="20" height="20" rx="4"/>

    <g class="flag">
      <rect x="760" y="298" width="236" height="26" rx="6" fill="#3d1214" stroke="#f85149"/>
      <text x="772" y="316" class="mono" font-size="13" fill="#ff7b72">ring: 5 accounts · 1 device</text>
    </g>
  </g>
</svg>
